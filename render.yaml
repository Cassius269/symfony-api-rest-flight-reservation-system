services:
  - type: web
    name: api_rest_flight_reservation_flight_system
    env: docker
    region: frankfurt
    plan: starter
    autoDeploy: true
    healthCheckPath: /
    dockerfilePath: ./Dockerfile
    disk:
      name: symfony-data
      mountPath: /var/www/var
      sizeGB: 1
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: bdd_flight_reservation
          property: connectionString
      - key: MAILER_DSN
        value: smtp://smtp.example.com:587
      - key: SERVER_NAME
        value: localhost
      - key: PHP_MEMORY_LIMIT
        value: 256M
      - key: MAX_EXECUTION_TIME
        value: 300

databases:
  - name: symfony-db
    databaseName: bdd_app_dockerisation
    user: symfony
    region: frankfurt
    plan: starter
    MajorVersion: 16
