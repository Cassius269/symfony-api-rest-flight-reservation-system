framework:
  rate_limiter:
    authenticated_api: # nom du limiteur
      policy: "token_bucket" # stratégie algorithmique utilisée
      limit: 100 # Capacité maximale du bucket (nombre de jetons attribués initialement)
      rate: { interval: "1 minute", amount: 20 } # Taux de réapprovisionnement des jetons à chaque intervalle
