api_platform:
  title: Système de réservation de vols d'avion # titre de la documentation de l’API
  version: 1.0.0
  formats:
    json: ["application/json"] # format par défaut de retour des ressources API
    jsonld: ["application/ld+json"] #format optionnel pour les tests
  patch_formats:
    json: ["application/merge-patch+json", "application/json"]
  defaults:
    #Configurer la pagination
    pagination_enabled: true #pagination activée par défaut pour toutes les ressources
    pagination_client_enabled: true # le client peut choisir d'activer la pagination
    pagination_maximum_items_per_page: 40 # nombre de ressources maximum à récupérer par page
    pagination_items_per_page: 10 # nombre de ressources à récupérer par page
    pagination_fetch_collection: true
    stateless: true
    cache_headers:
      vary: ["Content-Type", "Authorization", "Origin"]
  swagger: # activer l'authentification JWT depuis Swagger (permettre les actions sur les verbes HTTPs en ayant le bon token JWT)
    api_keys:
      JWT:
        name: Authorization
        type: header

  collection:
    pagination:
      page_parameter_name: page # le paramètre des pages s'appelera page
