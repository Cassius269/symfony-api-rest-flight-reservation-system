name: Tests
on: [push, pull_request]
jobs:
  quality:
    name: Tests
    runs-on: ubuntu-latest
    env:
      APP_ENV: test
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/app?serverVersion=10.7.3-MariaDB&charset=utf8mb4"

    services:
      database:
        image: mariadb:10.7.3
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: app
        ports:
          - "3306:3306"
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
          --health-start-period=20s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          tools: composer:v2

      - name: Setup Cache
        run: echo "COMPOSER_CACHE_DIR=$(composer config cache-dir)" >> "$GITHUB_ENV"
      - name: Caching deps
        uses: actions/cache@v4
        with:
          path: ${{ env.COMPOSER_CACHE_DIR }}
          key: php8.3-composer-${{ hashFiles('**/composer.json') }}
          restore-keys: |
            php8.3-composer-latest-

      - name: Update composer
        run: composer self-Update

      - name: install deps
        run: composer install --prefer-dist --no-interaction --no-progress --optimize-autoloader --ansi

      - name: Tests
        run: composer app-tests
        env:
          APP_ENV: test
          DATABASE_URL: mysql://root:root@127.0.0.1:${{ job.services.database.ports['3306']}}/app
